<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cờ Huyền Sử — Auto chess thần tướng Việt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Spectral:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e6e0cf;--panel:#f5f0e1;--panel2:#ebe3ce;--ink:#2a1e12;--ink2:#6a5840;--line:#c2b18a;
  --bronze:#8f5f16;--cinn:#b3281d;--jade:#23735f;--gold:#d6a335;--btn:#2a1e12;--btnink:#f5ecd4;
  --c:56px;
  --serif:'Spectral','Palatino Linotype',Palatino,Georgia,serif;
  --sans:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --spd:1;
}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#120d09;--panel:#1f1710;--panel2:#2a1f15;--ink:#f0e5cc;--ink2:#b3a283;--line:#4d3a22;--bronze:#d5a55a;--cinn:#e0503f;--jade:#4cb094;--btn:#d5a55a;--btnink:#1a1109}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(1100px 520px at 50% -8%,rgba(214,163,53,.16),transparent 62%),var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;overflow-x:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{min-height:100dvh;display:flex;flex-direction:column;isolation:isolate}
.pagefoot{text-align:center;padding:12px 10px 16px;color:var(--ink2);font-size:13px}
.pagefoot a{color:var(--gold);text-decoration:none;font-weight:600}
.pagefoot a:hover{text-decoration:underline}
.top{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);min-height:46px}
.brand{display:flex;align-items:center;gap:7px;font-family:var(--serif);font-weight:800;font-size:17px;white-space:nowrap}
.seal{width:24px;height:24px;display:grid;place-items:center;background:var(--cinn);color:#ffe9b0;border-radius:4px;transform:rotate(-4deg);font-style:normal;font-size:14px}
.rbox{display:flex;flex-direction:column;line-height:1.1;min-width:64px}
.rbox b{font-family:var(--serif);font-size:15px}.rbox small{color:var(--ink2);font-size:11px}
.tbar{flex:1;height:22px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);position:relative;overflow:hidden;min-width:40px}
.tbar i{position:absolute;inset:0 auto 0 0;width:100%;background:linear-gradient(90deg,var(--jade),var(--gold));transition:width .25s linear}
.tbar span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--ink);text-shadow:0 0 3px var(--panel)}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:5px 9px;font-weight:600;font-size:12px}
.go{border:0;border-radius:10px;padding:8px 14px;background:var(--cinn);color:#ffe9b0;font-family:var(--serif);font-weight:800;font-size:16px;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.go:disabled{opacity:.45;cursor:default}
.go.armed{animation:pulse .7s infinite alternate}
@keyframes pulse{to{box-shadow:0 0 0 4px rgba(214,163,53,.55)}}
.game{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px;overflow-x:hidden}
.side{width:calc(var(--c)*8)}
.right{order:0}.left{order:1}.stage{order:2}
.sh{display:none;font-family:var(--serif);font-weight:800;margin:0 0 6px;color:var(--ink2)}
.box{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}
.box::-webkit-scrollbar{display:none}
.stage{width:calc(var(--c)*8);display:flex;flex-direction:column;gap:6px}
.boardrow{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:57px;margin-bottom:16px}
.boardrow .boardwrap{order:0}.boardrow .benchL{order:1}.boardrow .benchR{order:2}
.boardwrap{position:relative;flex:none;width:calc(var(--c)*8);display:flex;flex-direction:column;justify-content:flex-end}
.tiltwrap{flex:none;transition:transform .45s ease,height .45s ease}
.tiltwrap.tilt{transform:perspective(1050px) rotateX(28deg);transform-origin:50% 100%;display:flex;flex-direction:column;justify-content:flex-end}
.tiltwrap.tilt .arena{overflow:visible;flex:none}
@media(min-width:980px){
  .stage{width:calc(var(--c)*9.8 + 24px)}
  .boardrow{flex-direction:row;align-items:stretch;justify-content:center;gap:6px;margin-top:57px;margin-bottom:16px}
  .boardrow .benchL{order:0;position:relative;z-index:100!important;pointer-events:auto}
  .boardrow .boardwrap{order:1;position:relative;z-index:1}
  .boardrow .benchR{order:2}
  .boardrow.tilted .bench{align-self:flex-end}
}
@media(min-width:980px){
  .game{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;align-content:start;gap:16px;padding:12px}
  .side{width:232px}.stage{grid-column:2;grid-row:1;align-self:start}.right{grid-column:3;grid-row:1;align-self:start}
  .box{flex-direction:column;overflow:visible}.sh{display:block}
}
.tr{flex:none;padding:0;border:none;background:none;opacity:.55;cursor:pointer}
.tr.on{opacity:1}
.traits-bar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:30px;padding:2px 0}
.traits-bar .tr .ti{width:28px;height:28px;font-size:14px}
.tr.on{opacity:1;border-color:var(--tc);box-shadow:inset 0 0 0 1px var(--tc)}
.tr .ti{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#2a1c12;font-size:13px;box-shadow:0 0 0 2px var(--tc)}
.tr b{font-family:var(--serif);font-weight:800;white-space:nowrap}
.tr .tn{margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.tr .tn u{text-decoration:none;color:var(--ink2)}.tr .tn u.a{color:var(--bronze);font-weight:800}
@media(min-width:980px){.tr{border-radius:12px;padding:6px 10px 6px 6px;font-size:13px}.tr .ti{width:30px;height:30px}}
.pl{flex:none;display:flex;align-items:center;gap:5px;padding:3px 8px 3px 3px;border-radius:999px;background:var(--panel);border:1.5px solid var(--line);font-size:12px;position:relative}
.pl .av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#2a1c12;font-size:14px}
.pl .hp{font-weight:700;font-variant-numeric:tabular-nums}
.pl .nm{display:none}.pl .bar{display:none}
.pl.me{border-color:var(--gold)}.pl.opp{border-color:var(--cinn);box-shadow:0 0 0 2px rgba(179,40,29,.3)}
.pl.dead{opacity:.45;filter:grayscale(1)}
@media(min-width:980px){.pl{border-radius:12px;padding:6px 10px 6px 6px;font-size:13px;gap:8px}.pl .av{width:30px;height:30px}.pl .nm{display:block;flex:1;font-weight:600}.pl .bar{display:block;width:60px;height:6px;border-radius:3px;background:var(--panel2);overflow:hidden}.pl .bar i{display:block;height:100%;background:var(--jade)}}
/* arena */
.arena{position:relative;width:calc(var(--c)*8);height:calc(var(--c)*7);border-radius:14px;overflow:hidden;background:#1c130d;box-shadow:0 0 0 2px #8a6528,0 0 0 5px #1b130d,0 12px 36px rgba(0,0,0,.45);touch-action:manipulation}
.tiles{position:absolute;inset:0;display:grid;grid-template:repeat(7,1fr)/repeat(8,1fr)}
.tile{background:linear-gradient(160deg,#2e2015,#241811)}.tile.b{background:linear-gradient(160deg,#38281c,#2a1d14)}
.tile.e{background:linear-gradient(160deg,#2f1c16,#241210)}.tile.e.b{background:linear-gradient(160deg,#38211a,#2a1613)}
.tile.p{background:linear-gradient(160deg,#233026,#1a241c)}.tile.p.b{background:linear-gradient(160deg,#293a2e,#1f2a20)}
.tile{box-shadow:inset 0 0 0 1px rgba(214,163,53,.06)}
.drum{position:absolute;left:50%;top:50%;width:calc(var(--c)*4.4);height:calc(var(--c)*4.4);transform:translate(-50%,-50%);opacity:.38;pointer-events:none}
.mid{position:absolute;left:calc(var(--c)*4 - 1px);top:0;bottom:0;width:2px;background:linear-gradient(180deg,transparent,#d6a335 20%,#d6a335 80%,transparent);box-shadow:0 0 8px rgba(214,163,53,.7)}
.ribbon{position:absolute;right:8px;top:calc(var(--c)*2.1);transform:translateY(-50%);background:#2a1a12;border:1.5px solid #d6a335;color:#f3e8cf;border-radius:999px;padding:3px 12px;font-size:12px;font-weight:600;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;z-index:4}
.ribbon.battle-hide,.boardwrap.battle .ribbon,.boardrow.battle .ribbon,.arena.battle ~ .ribbon,.boardwrap:has(.arena.battle) .ribbon,.boardrow:has(.arena.battle) .ribbon,.ribbon.hide{display:none!important}
.arena.battle .hint{display:none}
.hint{position:absolute;left:12%;right:12%;top:calc(var(--c)*6);transform:translateY(-50%);text-align:center;color:#c9b58a;font-size:12px;line-height:1.5;pointer-events:none;opacity:.6;z-index:1}
.bhud{position:absolute;top:8px;right:8px;z-index:6;display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;box-shadow:0 2px 8px rgba(0,0,0,.35);font-style:normal}
.bhud>*{pointer-events:auto}
.bhud .rbox{text-align:right;min-width:0;flex:none}
.bhud .rbox b{font-family:var(--sans);font-weight:700;font-style:normal;font-size:17px}
.bhud .rbox small{font-size:12px;font-style:normal}
.bhud .tbar{flex:none;width:125px;max-width:125px}
.bhud-actions{display:flex;align-items:center;gap:6px;flex:none}
.btn-quick{font-family:var(--sans);font-weight:700;font-style:normal;font-size:11px;padding:6px 9px;border-radius:10px;border:1px solid #d6a335;background:linear-gradient(180deg,#2e1e13,#1a110a);color:#ffe082;box-shadow:0 2px 0 rgba(0,0,0,.35);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:3px;transition:all .15s ease}
.btn-quick:hover{background:linear-gradient(180deg,#422a1a,#25180f);color:#fff;border-color:#ffd36a}
.btn-quick:active{transform:translateY(1px);box-shadow:none}
.btn-quick:disabled{opacity:.45;cursor:default}
.bhud .go{font-family:var(--sans);font-weight:700;font-style:normal;font-size:11px;padding:6px 10px;flex:none}
.cbtns{position:absolute;right:10px;bottom:10px;z-index:7;display:flex;flex-direction:column;gap:4px;opacity:0;pointer-events:none;transition:opacity 0s}
.cbtns.show{opacity:1;pointer-events:auto;transition:opacity 1.2s ease}
.cbtn{width:26px;height:26px;border-radius:50%;border:1px solid #d6a335;background:#1b130d;color:#ffd36a;font-family:var(--serif);font-weight:800;display:grid;place-items:center;position:relative;overflow:hidden;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.cbtn.clock i{position:absolute;left:0;right:0;bottom:0;height:100%;background:linear-gradient(180deg,var(--gold),var(--jade));opacity:.9;transition:height .25s linear}
.cbtn.clock span{position:relative;z-index:1;font-size:7px;color:#1a1109;text-shadow:0 0 3px #ffe9b0}
.cbtn.spd{font-size:9px}
.cells{position:absolute;left:0;top:0;bottom:0;width:calc(var(--c)*4);display:grid;grid-template:repeat(7,1fr)/repeat(4,1fr);z-index:2}
.cell{position:relative;display:grid;place-items:center;font-size:calc(var(--c)*.46)}
.cell.over,.slot.over{background:rgba(214,163,53,.28)}
.bl{position:absolute;inset:0;z-index:3;pointer-events:none}
.arena:not(.battle) .bl{display:none}
.arena.battle .cells{visibility:hidden}
#zl,#ul,#fxl,#fxc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#zl{z-index:1}#ul{z-index:10}#fxc{z-index:20}#fxl{z-index:30}
/* tokens: kích thước theo số sao */
.tok{position:relative;width:var(--tw,82%);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;line-height:1;transition:width .2s;
  background:radial-gradient(circle at 35% 28%,#6a4e36,#2a1c12 72%);
  box-shadow:0 0 0 calc(var(--c)*.03) var(--rc,#8e8777),0 0 0 calc(var(--c)*.055) #1b130d,0 0 0 calc(var(--c)*.075) #d6a335,0 4px 10px rgba(0,0,0,.55),inset 0 0 0 calc(var(--c)*.06) rgba(0,0,0,.35)}
/* token có ảnh chân dung: ảnh lấp đầy vòng tròn, bỏ viền trang trí (giữ vòng chọn + bóng đổ) */
.tok>.himg{width:100%;height:100%}
/* trứng Tiên: bằng 3/4 icon tướng */
.tok>.eggimg{width:75%;height:75%;object-fit:contain;filter:drop-shadow(0 0 6px rgba(255,211,106,.8))}
.tok:has(>img.himg){box-shadow:0 0 0 calc(var(--c)*.035) var(--rc,#8e8777),0 0 0 calc(var(--c)*.06) #1b130d,0 4px 10px rgba(0,0,0,.55)}
.bu.e .tok:has(>img.himg){box-shadow:0 0 0 calc(var(--c)*.035) #351c1c,0 0 0 calc(var(--c)*.06) #1b130d,0 4px 10px rgba(0,0,0,.55)}
/* Kích thước theo số sao: 1s chuẩn 100%, 2s là 108% 1s, 3s là 116% 1s */
.pu[data-s="1"]{--tw:90%}.pu[data-s="2"]{--tw:97.2%}.pu[data-s="3"]{--tw:104.4%}
.bu[data-s="1"]{--tw:100%}.bu[data-s="2"]{--tw:108%}.bu[data-s="3"]{--tw:116%}
.slot .pu[data-s="1"]{--tw:100%}.slot .pu[data-s="2"]{--tw:108%}.slot .pu[data-s="3"]{--tw:116%}

/* Hào quang token tròn: chỉ áp dụng cho tướng dạng token tròn chưa có sprite */
.pu:not(.has-spr)[data-s="1"] .tok, .bu:not(.e):not(.has-spr)[data-s="1"] .tok{filter:drop-shadow(0 0 3.5px rgba(255,211,106,.75))}
.pu:not(.has-spr)[data-s="2"] .tok, .bu:not(.e):not(.has-spr)[data-s="2"] .tok{filter:drop-shadow(0 0 5px rgba(255,211,106,.95))}
.pu:not(.has-spr)[data-s="3"] .tok, .bu:not(.e):not(.has-spr)[data-s="3"] .tok{filter:drop-shadow(0 0 3px #f0faff) drop-shadow(0 0 7px rgba(110,210,255,.95)) drop-shadow(0 0 12px rgba(80,180,255,.65))}

/* Hào quang quái và địch dạng token tròn: 1s đỏ 70%, 2s đỏ 100%, 3s đỏ 120% */
.bu.e:not(.has-spr)[data-s="1"] .tok{filter:drop-shadow(0 0 3.5px rgba(255,70,70,.75))}
.bu.e:not(.has-spr)[data-s="2"] .tok{filter:drop-shadow(0 0 5px rgba(255,50,50,.95))}
.bu.e:not(.has-spr)[data-s="3"] .tok{filter:drop-shadow(0 0 3px #ffcccc) drop-shadow(0 0 7px rgba(255,45,45,.95)) drop-shadow(0 0 12px rgba(255,30,30,.65))}

.tok .cg{position:absolute;right:-6%;bottom:-4%;width:38%;height:38%;border-radius:50%;background:#1b130d;display:grid;place-items:center;font-size:.36em;font-style:normal;box-shadow:0 0 0 1px #8a6528}
.st{position:absolute;left:0;right:0;top:0;text-align:center;font-size:calc(var(--c)*.2);color:#ffd36a;text-shadow:0 1px 2px #000;letter-spacing:-1px;line-height:1;pointer-events:none}
.st.s1{color:#e8c07a;text-shadow:0 0 3px rgba(255,211,106,.6),0 1px 2px #000}
.st.s2{color:#ffe082;text-shadow:0 0 5px rgba(255,211,106,.9),0 1px 2px #000}
.st.s3{color:#f0faff;text-shadow:0 0 6px #7fd5ff,0 0 10px rgba(120,210,255,.8),0 1px 2px #000}
.pu{position:relative;width:100%;height:100%;display:grid;place-items:center;touch-action:none;cursor:grab}
.pu.sel .tok{box-shadow:0 0 0 3px #fff,0 0 14px 4px var(--gold)}
.pu .nm{display:none;position:absolute;bottom:0;left:-4%;right:-4%;text-align:center;font-size:10px;font-weight:600;color:#f3e8cf;text-shadow:0 1px 2px #000,0 0 3px #000;pointer-events:none;white-space:nowrap;overflow:hidden}
.big .pu .nm{display:block}
.bench{display:grid;gap:3px;width:100%;height:calc(var(--c)*.8);position:relative;z-index:100!important;pointer-events:auto}
.benchL{grid-template-columns:repeat(9,1fr)}
.benchR{display:none}
@media(min-width:980px){
  .bench{width:calc(var(--c)*.9);height:auto;display:flex!important;flex-direction:column!important;justify-content:space-between!important;align-items:center!important}
  .boardrow.tilted .benchL{display:block!important;position:relative!important}
}
.slot{position:relative;width:var(--bs,calc(var(--c)*.8))!important;height:var(--bs,calc(var(--c)*.8))!important;max-width:var(--bs,calc(var(--c)*.8))!important;max-height:var(--bs,calc(var(--c)*.8))!important;aspect-ratio:1!important;flex:none!important;box-sizing:border-box!important;border-radius:50%;background:radial-gradient(circle at 45% 35%,rgba(65,50,35,.55),rgba(15,10,6,.75));border:1.5px solid rgba(214,163,53,.65);display:grid;place-items:center;font-size:calc(var(--c)*.34);box-shadow:inset 0 2px 6px rgba(0,0,0,.6),0 2px 8px rgba(0,0,0,.45);z-index:100!important;pointer-events:auto;transition:border-color .2s,box-shadow .2s}
.boardrow.tilted .benchL .slot{position:absolute!important;margin:0!important}
.slot:hover{border-color:rgba(255,215,80,.95);box-shadow:0 0 12px rgba(214,163,53,.55),inset 0 1px 3px rgba(255,230,150,.4)}
.slot .st{font-size:calc(var(--c)*.15)}
.slot .pu{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;display:grid;place-items:center;z-index:101!important;pointer-events:auto;cursor:grab}
.slot .pu.has-spr .tok{animation:none!important;transform:translateY(-22%) scale(1.15);transform-origin:50% 100%}
.slot .pu.has-spr .st{top:-23px;font-size:calc(var(--c)*.18);z-index:3;pointer-events:none}
.slot .pu.has-spr[data-s="1"] .st{top:-21px}
.slot .pu.has-spr[data-s="2"] .st{top:-23px}
.slot .pu.has-spr[data-s="3"] .st{top:-26px}
.slot .pu .nm{display:block!important;position:absolute;bottom:-15px;left:-20%;right:-20%;text-align:center;font-size:10px;font-weight:600;color:#f3e8cf;text-shadow:0 1px 3px #000,0 0 4px #000;pointer-events:none;white-space:nowrap}
/* bang thong tin mini ben canh tuong hang cho - keo dai them 10px (width 104px) */
.bench-info{position:absolute;right:calc(100% + 7px);top:50%;transform:translateY(-50%);width:104px;height:38px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;gap:1px;padding:2px 6px 3px 6px;background:rgba(20,13,8,.92);border:1px solid rgba(214,163,53,.5);border-radius:5px;box-shadow:0 3px 10px rgba(0,0,0,.65);pointer-events:none;z-index:102;overflow:hidden}
.bi-top{display:flex;align-items:center;justify-content:space-between;line-height:1;height:13px}
.bi-traits{display:flex;align-items:center;gap:3px}
.bi-ico{width:13px;height:13px;border-radius:50%;background:#2a1c12;border:1px solid rgba(214,163,53,.5);display:grid;place-items:center;font-size:8px;line-height:1}
.bi-stars{font-size:9.5px;font-weight:700;letter-spacing:-1px;line-height:1}
.bi-stars.s1{color:#ffd36a;text-shadow:0 0 3px rgba(255,211,106,.7)}
.bi-stars.s2{color:#ffe082;text-shadow:0 0 5px rgba(255,211,106,.9)}
.bi-stars.s3{color:#f0faff;text-shadow:0 0 5px #7fd5ff,0 0 9px rgba(120,210,255,.8)}
.bi-line{height:1px;background:linear-gradient(90deg,rgba(214,163,53,.65),rgba(214,163,53,.15));margin:1px 0}
.bi-name{font-size:10.5px;font-weight:600;color:#f5ecd4;text-shadow:0 1px 2px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25;padding-bottom:1px}
@media(max-width:979px){.bench-info{display:none}}
@media(min-width:980px){.slot .pu .nm{display:none!important}.slot .st{display:none!important}.slot .pu.has-spr .st{display:none!important}}
/* đơn vị trong trận */
.bu{position:absolute;left:0;top:0;width:var(--c);height:var(--c);display:grid;place-items:center;font-size:calc(var(--c)*.55);transition:transform calc(.45s / var(--spd)) linear;will-change:transform}
.bu .tok{margin-top:calc(var(--c)*.1);transition:width .2s,transform .3s,scale .18s,rotate .18s}
.bu.e .tok{box-shadow:0 0 0 calc(var(--c)*.03) #351c1c,0 0 0 calc(var(--c)*.055) #1b130d,0 4px 10px rgba(0,0,0,.55),inset 0 0 0 calc(var(--c)*.06) rgba(0,0,0,.35)}
.bu.sm{--tw:70%!important}.bu.sm .tok{opacity:.92;filter:hue-rotate(-20deg) brightness(1.1)}
.bu.boss:not(.has-spr){--tw:125%!important}
.bu.grow .tok{scale:1.4}
.bu.grow.has-spr[data-face="-1"] .tok{scale:-1.4 1.4}
.bu.hid{opacity:.28}
/* sprite tướng trên bàn: 1s chuẩn 135% (100%), 2s là 144%, 3s là 154% */

/* ============================================================
   LỰA CHỌN 1: ĐĨA HÀO QUANG DƯỚI CHÂN TƯỚNG SPRITE (CHUẨN TFT)
   - 1 Sao: Đứng trên sàn bình thường, sắc nét 100%, không bị chói
   - 2 Sao: Đĩa hào quang Hoàng Kim (Vàng rực) xoay thở dưới chân
   - 3 Sao: Đĩa hào quang Lam Ngọc / Kim Cương (Xanh bạc) uy lực tỏa sáng
   ============================================================ */

/* --- 1. TRÊN BÀN CỜ (CẢ KHI CHỌN TƯỚNG / PREP VÀ TRONG TRẬN ĐẤU / BATTLE) --- */
/* Căn chỉnh vị trí đĩa hào quang khớp chuẩn xác 100% với điểm đặt chân tướng */
/* 2 Sao - Hoàng Kim (chuẩn 100% kích thước ô cờ) */
.bu.has-spr[data-s="2"]::before,
.cell .pu.has-spr[data-s="2"]::before,
.pu[data-kind="board"].has-spr[data-s="2"]::before{
  content:'';position:absolute;left:50%;bottom:calc(var(--c)*.28);width:calc(var(--c)*.88);height:calc(var(--c)*.40);
  transform:translateX(-50%);border-radius:50%;pointer-events:none;z-index:0;
  border:1.5px solid rgba(255,220,80,.75);
  background:radial-gradient(ellipse at center,rgba(255,235,120,.7) 0%,rgba(240,180,40,.45) 45%,rgba(180,115,15,.15) 70%,transparent 85%);
  box-shadow:0 0 12px 2px rgba(255,200,50,.65),0 0 24px 4px rgba(230,150,20,.35),inset 0 0 8px rgba(255,220,70,.6);
  animation:auraPulseGold 2.8s ease-in-out infinite;
}
/* 3 Sao - Lam Ngọc / Kim Cương (chuẩn 100% kích thước ô cờ) */
.bu.has-spr[data-s="3"]::before,
.cell .pu.has-spr[data-s="3"]::before,
.pu[data-kind="board"].has-spr[data-s="3"]::before{
  content:'';position:absolute;left:50%;bottom:calc(var(--c)*.26);width:calc(var(--c)*.96);height:calc(var(--c)*.44);
  transform:translateX(-50%);border-radius:50%;pointer-events:none;z-index:0;
  border:2px solid rgba(230,250,255,.9);
  background:radial-gradient(ellipse at center,rgba(240,252,255,.85) 0%,rgba(110,220,255,.52) 45%,rgba(40,150,240,.22) 70%,transparent 88%);
  box-shadow:0 0 16px 3px rgba(110,215,255,.85),0 0 32px 6px rgba(60,160,255,.5),inset 0 0 10px rgba(190,245,255,.75);
  animation:auraPulseDiamond 2.4s ease-in-out infinite;
}

/* --- 2. TRÊN BỆ CHỌN TƯỚNG (BENCH / HÀNG CHỜ) - THU NHỎ SIZE 80% GỌN GÀNG --- */
/* 2 Sao - Bệ chọn tướng (size 80%) */
.slot .pu.has-spr[data-s="2"]::before,
.pu[data-kind="bench"].has-spr[data-s="2"]::before{
  content:'';position:absolute;left:50%;bottom:calc(var(--c)*.03);width:calc(var(--c)*.70);height:calc(var(--c)*.34);
  transform:translateX(-50%);border-radius:50%;pointer-events:none;z-index:0;
  border:1.2px solid rgba(255,220,80,.75);
  background:radial-gradient(ellipse at center,rgba(255,235,120,.7) 0%,rgba(240,180,40,.45) 45%,rgba(180,115,15,.15) 70%,transparent 85%);
  box-shadow:0 0 8px 1px rgba(255,200,50,.6),0 0 16px 3px rgba(230,150,20,.3),inset 0 0 6px rgba(255,220,70,.55);
  animation:auraPulseGold 2.8s ease-in-out infinite;
}
/* 3 Sao - Bệ chọn tướng (size 80%) */
.slot .pu.has-spr[data-s="3"]::before,
.pu[data-kind="bench"].has-spr[data-s="3"]::before{
  content:'';position:absolute;left:50%;bottom:calc(var(--c)*.02);width:calc(var(--c)*.78);height:calc(var(--c)*.37);
  transform:translateX(-50%);border-radius:50%;pointer-events:none;z-index:0;
  border:1.6px solid rgba(230,250,255,.9);
  background:radial-gradient(ellipse at center,rgba(240,252,255,.85) 0%,rgba(110,220,255,.52) 45%,rgba(40,150,240,.22) 70%,transparent 88%);
  box-shadow:0 0 12px 2px rgba(110,215,255,.8),0 0 24px 4px rgba(60,160,255,.45),inset 0 0 8px rgba(190,245,255,.7);
  animation:auraPulseDiamond 2.4s ease-in-out infinite;
}

/* --- 3. ĐỊCH / QUÁI VẬT --- */
/* Quái nhỏ (Ngư Quái, Mộc Quái, Hồ Quái): Hào quang màu da cam dưới chân */
.bu.has-spr.mon:not(.boss)::before{
  content:'';position:absolute;left:50%;bottom:calc(var(--c)*.28);width:calc(var(--c)*.88);height:calc(var(--c)*.40);
  transform:translateX(-50%);border-radius:50%;pointer-events:none;z-index:0;
  border:1.6px solid rgba(255,145,35,.85);
  background:radial-gradient(ellipse at center,rgba(255,185,70,.78) 0%,rgba(255,125,20,.5) 45%,rgba(210,70,0,.18) 70%,transparent 86%);
  box-shadow:0 0 12px 2px rgba(255,130,25,.75),0 0 24px 4px rgba(230,80,10,.42),inset 0 0 8px rgba(255,170,60,.65);
  animation:auraPulseOrange 2.6s ease-in-out infinite;
}

/* Boss (Hồ Tinh, Mộc Tinh, Ngư Tinh): Hào quang màu hồng tím uy dũng */
.bu.has-spr.boss::before,
.bu.has-spr.mon.boss::before{
  content:'';position:absolute;left:50%;bottom:calc(var(--c)*.26);width:calc(var(--c)*.98);height:calc(var(--c)*.45);
  transform:translateX(-50%);border-radius:50%;pointer-events:none;z-index:0;
  border:2px solid rgba(245,115,230,.9);
  background:radial-gradient(ellipse at center,rgba(255,160,245,.82) 0%,rgba(215,60,200,.52) 45%,rgba(140,25,170,.22) 70%,transparent 88%);
  box-shadow:0 0 16px 3px rgba(230,60,210,.85),0 0 32px 6px rgba(170,30,210,.52),inset 0 0 10px rgba(255,175,250,.78);
  animation:auraPulsePinkPurple 2.4s ease-in-out infinite;
}

/* Tướng địch 2-3 sao trong PvP (không phải quái vật) */
.bu.has-spr.e:not(.mon)[data-s="2"]::before{
  border-color:rgba(255,80,80,.75);
  background:radial-gradient(ellipse at center,rgba(255,120,120,.7) 0%,rgba(220,45,45,.45) 45%,rgba(150,20,20,.15) 70%,transparent 85%);
  box-shadow:0 0 12px 2px rgba(255,60,60,.65),0 0 24px 4px rgba(200,30,30,.35),inset 0 0 8px rgba(255,80,80,.6);
  animation:auraPulseRed 2.8s ease-in-out infinite;
}
.bu.has-spr.e:not(.mon)[data-s="3"]::before{
  border-color:rgba(255,150,150,.9);
  background:radial-gradient(ellipse at center,rgba(255,170,170,.85) 0%,rgba(240,45,45,.55) 45%,rgba(170,20,20,.22) 70%,transparent 88%);
  box-shadow:0 0 16px 3px rgba(255,60,60,.85),0 0 32px 6px rgba(220,20,20,.5),inset 0 0 10px rgba(255,120,120,.75);
  animation:auraPulseRed 2.4s ease-in-out infinite;
}
.bu.dead{pointer-events:none!important;z-index:2!important}

@keyframes auraPulseGold{0%,100%{transform:translateX(-50%) scale(.96);opacity:.85;box-shadow:0 0 10px 2px rgba(255,200,50,.55),inset 0 0 6px rgba(255,220,70,.5)}50%{transform:translateX(-50%) scale(1.05);opacity:1;box-shadow:0 0 18px 4px rgba(255,220,70,.85),0 0 30px 6px rgba(230,160,30,.45),inset 0 0 10px rgba(255,235,100,.75)}}

.fxt{position:absolute;pointer-events:none;font-family:var(--serif);font-weight:900;transform:translate(-50%,-50%);text-shadow:0 0 10px currentColor,0 0 20px currentColor,0 2px 4px #000;z-index:100}

.peek .tiers div{padding:1px 0;color:#b9a98a}.peek .tiers .a{color:#ffd36a;font-weight:700}

.shop{position:relative;display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px}
.ctl{display:flex;align-items:center;gap:8px}
.lv{flex:1;min-width:0}
.lv b{font-family:var(--serif);font-size:14px}
.lv .xp{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;margin-top:3px;border:1px solid var(--line)}

.lv small{color:var(--ink2);font-size:11px}
.gold{font-family:var(--serif);font-weight:800;font-size:17px;white-space:nowrap}

.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}

.btn{border:1.5px solid var(--bronze);border-radius:10px;background:var(--panel2);padding:7px 6px;font-weight:700;font-size:12.5px;display:flex;justify-content:center;gap:6px;align-items:center}

.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.card{position:relative;border:2px solid var(--rc);border-radius:10px;background:linear-gradient(180deg,#3e2d1e,#1d140d);color:#f3e8cf;padding:0;display:flex;flex-direction:column;align-items:stretch;overflow:hidden}

.card .em .himg{width:104px;height:104px}

.card .co{font-size:12px;font-weight:700;color:#ffd36a;text-align:center;line-height:1.15;padding:4px 0 5px;background:#1d140d}
.card .co small{display:block;font-size:9.5px;font-weight:600;color:#b9a98a}
.coin{width:1.25em;height:1.25em;vertical-align:-.28em;object-fit:contain}
.card .i{position:absolute;top:5px;right:5px;width:20px;height:20px;border-radius:50%;border:0;background:#0009;color:#f3e8cf;font-size:11px;line-height:1;padding:0;z-index:3}
.card.no{opacity:.55}
.card.gone{visibility:hidden}
.card.pair{box-shadow:0 0 0 2px #fff,0 0 12px 2px var(--gold)}
.sellz{position:absolute;inset:0;border-radius:12px;background:rgba(179,40,29,.88);color:#ffe9b0;display:none;place-items:center;font-family:var(--serif);font-weight:800;font-size:18px;z-index:5}
.shop.selling .sellz{display:grid}.shop.selling.over .sellz{background:rgba(214,60,40,1)}
.ghost{position:fixed;left:0;top:0;z-index:99;pointer-events:none;display:grid;place-items:center;transform:translate(-50%,-50%)}
.ov{position:fixed;inset:0;z-index:9000;display:none;place-items:center;background:rgba(10,6,4,.8);padding:14px;overflow-y:auto}
.ov.show{display:grid}
.dlg{position:relative;width:min(460px,100%);background:var(--panel);border:1.5px solid var(--bronze);border-radius:16px;padding:20px 18px;box-shadow:0 20px 60px rgba(0,0,0,.6);max-height:96dvh;overflow-y:auto}
.dlg h1{font-family:var(--serif);font-weight:800;font-size:38px;margin:0;line-height:1;color:var(--cinn)}

.seg button{border:0;background:transparent;padding:6px 12px;font-weight:600}
.seg button.on{background:var(--btn);color:var(--btnink)}
.big-go{width:100%;margin-top:6px;padding:12px;font-size:20px;border-radius:12px}
.how{margin:10px 0 0;padding-left:18px;color:var(--ink2);line-height:1.6;font-size:13px}

.relics{display:grid;gap:8px;margin-top:10px}
.relic{display:flex;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--bronze);border-radius:12px;background:var(--panel2);padding:10px}

.relic b{font-family:var(--serif);font-size:16px}.relic span{display:block;color:var(--ink2);font-size:12.5px}
.relic:hover{background:var(--panel)}
.drumbg{position:absolute;right:-40px;top:-40px;width:200px;height:200px;opacity:.14;pointer-events:none}
#toast{position:fixed;left:50%;top:58px;transform:translateX(-50%);z-index:10000;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:#2a1a12;color:#ffe9b0;border:1px solid #d6a335;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;animation:tst 2.4s forwards;box-shadow:0 6px 20px rgba(0,0,0,.4)}
@keyframes tst{0%{opacity:0;transform:translateY(-8px)}10%,80%{opacity:1;transform:none}100%{opacity:0}}
.himg{width:1em;height:1em;object-fit:cover;border-radius:50%;display:inline-block;vertical-align:middle}
.avp{display:inline-flex;gap:4px;flex-wrap:wrap}

.dlg .note{font-size:12.5px;color:var(--ink2);border-left:3px solid var(--gold);padding-left:10px;margin:10px 0}

.demobar .dtok{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:24px;line-height:1;background:radial-gradient(circle at 35% 28%,#6a4e36,#2a1c12 72%);box-shadow:0 0 0 2px var(--rc,#8e8777),0 0 0 4px #1b130d,0 0 0 5px #d6a335;flex:none}

/* Bảng Thống Kê Chiến Trận (Kết thúc ván: Sát thương / Chống đỡ) */
.qc-modal{position:fixed;inset:0;background:rgba(10,6,4,.78);backdrop-filter:blur(6px);z-index:9500;display:none;place-items:center;padding:12px;box-sizing:border-box}
.qc-modal.show{display:grid}
.qc-panel{position:relative;width:min(760px,96vw);max-height:min(640px,92vh);background:radial-gradient(circle at 50% 15%,#fff9ea,#f1e2c6 75%),#ebd6b3;border:2px solid #8e622b;outline:1.5px solid #d6a335;outline-offset:-5px;box-shadow:0 20px 50px rgba(0,0,0,.85),0 0 30px rgba(214,163,53,.3);border-radius:14px;display:flex;flex-direction:column;padding:20px 20px 16px 20px;box-sizing:border-box;animation:qcPop .28s cubic-bezier(.16,1,.3,1);color:#24160c}
@keyframes qcPop{from{opacity:0;transform:scale(.92) translateY(12px)}to{opacity:1;transform:scale(1) translateY(0)}}

.qc-close{position:absolute;top:12px;right:14px;width:28px;height:28px;border-radius:50%;border:1px solid #735032;background:#3a2215;color:#ffd36a;display:grid;place-items:center;font-size:14px;font-weight:700;cursor:pointer;z-index:3;transition:transform .15s,background .15s}

.qc-hdr{text-align:center;margin-bottom:10px}
.qc-title-txt{font-family:var(--serif);font-size:19px;font-weight:800;color:#6a1a14;letter-spacing:1.5px;text-shadow:0 1px 0 rgba(255,255,255,.6);line-height:1.2}
.qc-res-wrap{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px}

.qc-res-badge.lose{background:#c62828;color:#fff;box-shadow:0 1px 4px rgba(198,40,40,.4)}
.qc-res-badge.draw{background:#5d4037;color:#ffd875;box-shadow:0 1px 4px rgba(93,64,55,.4)}
.qc-res-sub{font-size:12px;font-weight:700;color:#6b4d34}
.qc-res-line{font-size:11.5px;color:#7a6048;font-style:italic;margin-top:2px;max-width:90%;margin-left:auto;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.qc-tabs{display:flex;justify-content:center;gap:10px;margin-bottom:12px}
.qc-tab{border:1.5px solid #997858;background:rgba(70,45,25,.08);color:#55341c;font-family:var(--serif);font-weight:700;font-size:13px;padding:5px 18px;border-radius:999px;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:5px}

.qc-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1;min-height:0;overflow:hidden;margin-bottom:12px}

    else if(sk.t==='aoe')a.push('Gây '+f(sk.d)+' sát thương trong '+sk.r+' ô');

  if(sk.press)a.push('núi đè khóa hoàn toàn '+g(sk.press)+' giây (không hành động, không nạp nộ; boss miễn nhiễm)');
  if(sk.sm)a.push('gọi '+g(sk.sm)+' Kim Long phân thân uốn lượn hỗ chiến (tồn tại 8 giây, không tính vào số tướng)');
  if(sk.zone){const z=sk.zone;a.push(z.kind==='flood'?'tạo vùng lũ '+(z.r*2)+' ô trong '+z.dur+' giây: '+f(z.dps)+' sát thương mỗi giây, chậm '+Math.round(z.slow*100)+'% (boss chậm một nửa)':'cắm cọc '+(z.r*2)+' ô trong '+z.dur+' giây: địch bước vào bị đâm '+f(z.d)+' sát thương một lần và chậm '+Math.round(z.slow*100)+'%');}
  if(sk.trail)a.push('để lại vệt lửa '+g(sk.trail.dur)+' giây, '+f(sk.trail.dps)+' sát thương mỗi giây (không cộng dồn)');
  if(sk.pull)a.push('kéo '+g(sk.pull.n)+' kẻ địch xa nhất về phía mình, gây '+f(sk.pull.d)+' sát thương (boss miễn nhiễm)');
  if(sk.exec)a.push('kẻ địch dưới '+Math.round(sk.exec*100)+'% máu bị kết liễu (boss miễn nhiễm)');
  if(sk.grow)a.push('phóng to '+g(sk.grow.dur)+' giây: +'+pc(sk.grow.ad)+'% sát thương, +'+g(sk.grow.arm)+' giáp');
  if(sk.heal)a.push('hồi '+f(sk.heal)+' máu cho '+who);
  if(sk.sh&&!sk.taunt)a.push('tạo khiên '+f(sk.sh)+' cho '+who);
  else if(sk.sh&&sk.taunt)a.push('khiên '+f(sk.sh));
  if(sk.burst)a.push('khiên vỡ do bị đánh thì nổ '+f(sk.burst.d)+' sát thương trong '+sk.burst.r+' ô');
  if(sk.egg)a.push('đặt ấn Trứng Tiên lên đồng minh thấp máu nhất (chỉ 1 ấn, đến khi tướng đó chết; xuất chiêu lại thì chuyển ấn, hoặc hồi '+pc(sk.egg.reHeal)+'% máu nếu vẫn là người đó). Tướng mang ấn nhận sát thương kết liễu sẽ hóa trứng với '+pc(sk.egg.hpPct)+'% máu, ấp '+sk.egg.hatch+' giây: trứng vỡ thì chết hẳn, sống sót thì tái sinh '+pc(sk.egg.reviveHp)+'% máu, 50% nộ, đẩy lùi địch 1 ô');
  if(sk.ad&&!sk.grow)a.push('+'+pc(sk.ad)+'% sát thương trong '+sk.dur+' giây cho '+who);
  if(sk.as)a.push('+'+pc(sk.as)+'% tốc đánh trong '+(sk.dur||6)+' giây cho '+who);
  const s=a.join('; ');return s.charAt(0).toUpperCase()+s.slice(1)+'.';
}

function mkBU(u,side,x,y,counts,rfx,bonds){
  const H=HERO[u.h],cs=CS[H.c],s=u.s;
  let hp=HPC[H.cost-1]*cs.hp*Math.pow(1.8,s-1),ad=ADC[H.cost-1]*cs.ad*Math.pow(1.5,s-1);
  const f={hp:0,ad:0,as:0,armor:0,spell:0,crit:cs.crit,ls:0,mana:cs.mana0};
  const add=fx=>{if(!fx)return;for(const k in fx)f[k]=(f[k]||0)+fx[k];};
  for(const t in counts){const i=tierOf(t,counts[t]);if(i<0)continue;const T=TR[t];if(T.scope==='team'||H.o===t||H.c===t)add(T.tiers[i].fx);}
  add(rfx);
  if(bonds){for(const b of bonds){if(b.scope==='team'||b.heroes.includes(u.h))add(b.fx);}}
  hp=Math.round(hp*(1+f.hp));ad*=1+f.ad;
  return bareUnit({id:UID++,side,x,y,h:u.h,star:s,name:H.name,ico:H.ico,cost:H.cost,cls:H.c,org:H.o,col:TR[H.o].col,max:hp,hp,ad,armor:cs.armor+f.armor,as:cs.as*(1+f.as),range:cs.range,crit:f.crit,spell:f.spell,ls:f.ls,sk:H.sk,maxMana:H.sk.mana,mana:Math.min(f.mana,Math.floor(H.sk.mana*.6))});
}

}

    for(const [dx,dy] of DIRS){const nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=W||ny>=HH)continue;const ni=ny*W+nx;if(prev[ni]!==-2||B.occ[ni])continue;prev[ni]=cur;q.push(ni);}
  }
  if(goal<0)return;
  let c=goal;while(prev[c]!==start)c=prev[c];
  B.occ[start]=null;u.x=c%W;u.y=(c/W)|0;B.occ[c]=u;
  u.mcd=MOVE_CD/Math.max(.3,1-(u.slow?u.slow.pct:0));
}
function act(B,u){
  let t=u.tgt;
  if(u.forced){const ft=B.byId[u.forced.id];if(ft&&ft.alive&&!(ft.hide>0))t=u.tgt=ft;}
  if(!t||!t.alive||t.hide>0)t=u.tgt=nearest(B,u);
  if(!t)return;
  let d=cheb(u,t);
  if(d>u.range&&!u.forced){const n=nearest(B,u);if(n&&cheb(u,n)<=u.range){u.tgt=n;t=n;d=cheb(u,n);}}
  const inR=d<=u.range,sk=u.sk;
  if(sk&&u.mana>=u.maxMana&&u.acd<=0&&(inR||!needsRange(sk))){castSkill(B,u);return;}
  if(u.demoHold)return;
  if(inR){if(u.acd<=0)attack(B,u,t);}
  else if(u.mcd<=0)moveToward(B,u,t);
}
function step(B,dt){
  if(B.over)return;
  B.t+=dt;
  if(B.t>30){const k=.006*(B.t-30)*dt;for(const u of B.units)if(u.alive)dealDamage(B,null,u,u.max*k,'true',false,{ignoreShield:true,noMana:true,silent:true,pierce:true,noBurst:true});}
  stepZones(B,dt);
  for(const u of B.units){
    if(!u.alive)continue;
    if(u.acd>0)u.acd-=dt;if(u.mcd>0)u.mcd-=dt;
    if(u.imm>0)u.imm-=dt;if(u.hide>0)u.hide-=dt;if(u.press>0)u.press-=dt;if(u.mslow>0)u.mslow-=dt;
    if(u.egg){u.egg.t-=dt;if(u.stun>0)u.stun-=dt;if(u.egg.t<=0)hatchEgg(B,u);continue;}
    if(u.slow){u.slow.t-=dt;if(u.slow.t<=0)u.slow=null;}
    if(u.dmgRed){u.dmgRed.t-=dt;if(u.dmgRed.t<=0)u.dmgRed=null;}
    if(u.forced){u.forced.t-=dt;if(u.forced.t<=0)u.forced=null;}
    if(u.tarm.length){for(const a of u.tarm)a.t-=dt;u.tarm=u.tarm.filter(a=>a.t>0);}
    if(u.shT>0){u.shT-=dt;if(u.shT<=0){u.sh=0;u.burst=null;}}
    if(u.bf.length){for(const b of u.bf)b.t-=dt;u.bf=u.bf.filter(b=>b.t>0);}
    if(u.life>0){u.life-=dt;if(u.life<=0){u.life=0;u.hp=0;u.alive=false;B.occ[u.y*W+u.x]=null;em(B,{k:'die',id:u.id});continue;}}
    gainMana(u,1.5*dt);
    if(u.pend.length){for(const p of u.pend)p.t-=dt;const due=u.pend.filter(p=>p.t<=0);u.pend=u.pend.filter(p=>p.t>0);for(const p of due)runPend(B,u,p);}
    if(u.stun>0||u.press>0){if(u.stun>0)u.stun-=dt;continue;}
    act(B,u);
  }
  let a0=0,a1=0;for(const u of B.units)if(u.alive&&!u.sm){if(u.side)a1++;else a0++;}
  if(a0===0||a1===0){
    B.over=true;
    if(a0===0&&a1===0){B.winner=null;B.surv=0;}else{B.winner=a0>0?0:1;B.surv=a0>0?a0:a1;}
    for(const u of B.units)if(u.alive&&u.sm){u.alive=false;B.occ[u.y*W+u.x]=null;em(B,{k:'die',id:u.id});}
  }else if(B.t>=70){
    B.over=true;let h0=0,h1=0;for(const u of B.units)if(u.alive&&!u.sm){if(u.side)h1+=u.hp;else h0+=u.hp;}
    if(h0===h1){B.winner=null;B.surv=0;}else{B.winner=h0>h1?0:1;B.surv=B.winner?a1:a0;}
  }
}
function runBattle(B){let n=0;while(!B.over&&n++<2000)step(B,TICK);return B;}

/* --- người chơi, cửa hàng, gộp sao --- */
function newPlayer(name,human,i,av){return {id:i,name,human,av,hp:100,gold:6,lvl:2,xp:0,bench:Array(9).fill(null),board:Array(28).fill(null),shop:[],streak:0,lastWin:false,alive:true,place:0,relics:[],fav:[],log:[]};}
function mkUnitObj(h,s){return {uid:UID++,h,s:s||1};}
function levelCheck(p){while(p.lvl<9&&p.xp>=XPN[p.lvl]){p.xp-=XPN[p.lvl];p.lvl++;}if(p.lvl>=9)p.xp=0;}
function rollShop(G,p){
  const od=ODDS[p.lvl],out=[];
  for(let i=0;i<5;i++){let r=rnd(100),c=0;while(c<4&&r>=od[c]){r-=od[c];c++;}out.push(pickFromPool(G,c+1));}
  return out;
}
function pickFromPool(G,cost){
  for(let d=0;d<5;d++){
    const costs=d===0?[cost]:[];
    if(d>0){if(cost+d<=5)costs.push(cost+d);if(cost-d>=1)costs.push(cost-d);}
    for(const cc of costs){
      const avail=BYCOST[cc].filter(h=>poolCount(G,h)>0);
      if(avail.length)return pickOf(avail);
    }
  }
  return null;
}
function mergeAll(P){
  let again=true;
  while(again){
    again=false;
    const locs=[];
    P.board.forEach((u,i)=>u&&locs.push({a:'board',i,u}));
    P.bench.forEach((u,i)=>u&&locs.push({a:'bench',i,u}));
    const groups={};
    for(const l of locs){const k=l.u.h+'|'+l.u.s;(groups[k]=groups[k]||[]).push(l);}
    for(const k in groups){
      const g=groups[k];
      if(g.length>=3&&g[0].u.s<3){
        g[0].u.s++;for(const r of g.slice(1,3))P[r.a][r.i]=null;
        P.log.push({h:g[0].u.h,s:g[0].u.s});again=true;break;
      }
    }
  }
}
function addUnit(P,u){
  const i=P.bench.indexOf(null);
  if(i>=0){P.bench[i]=u;mergeAll(P);return true;}
  P.bench.push(u);mergeAll(P);
  if(P.bench.length>9){if(P.bench[9]===null){P.bench.length=9;return true;}P.bench.pop();return false;}
  return true;
}
function canAdd(P,h){
  if(P.bench.indexOf(null)>=0)return true;
  const n=[...P.board,...P.bench].filter(u=>u&&u.h===h&&u.s===1).length;
  return n>=2;
}
function buyUnit(G,P,i){
  const h=P.shop[i];if(!h)return false;
  const cost=HERO[h].cost;if(P.gold<cost||!canAdd(P,h))return false;
  if(poolCount(G,h)<=0){P.shop[i]=null;return false;}
  if(!poolTake(G,h))return false;
  if(!addUnit(P,mkUnitObj(h,1))){poolReturn(G,h,1);return false;}
  P.gold-=cost;P.shop[i]=null;return true;
}
function sellValue(u){const c=HERO[u.h].cost;return u.s===1?c:c*Math.pow(3,u.s-1)-(c>1?1:0);}
function sellUnit(G,P,k,i){const u=P[k][i];if(!u)return 0;const v=sellValue(u);P.gold+=v;P[k][i]=null;poolReturn(G,u.h,copiesOf(u));return v;}
function moveUnit(P,f,t){
  if(f.k===t.k&&f.i===t.i)return false;
  const u=P[f.k][f.i];if(!u)return false;
  const v=P[t.k][t.i];
  if(t.k==='board'&&f.k==='bench'&&!v&&boardCount(P)>=P.lvl)return false;
  P[f.k][f.i]=v||null;P[t.k][t.i]=u;return true;
}
function buyXp(P){if(P.gold<4||P.lvl>=9)return false;P.gold-=4;P.xp+=4;levelCheck(P);return true;}
function reroll(G,P){if(P.gold<2)return false;P.gold-=2;P.shop=rollShop(G,P);return true;}
const MELEE=['hove','chienbinh','dukich'];
const MELEE_FORM_SLOTS=[
  [3,3],[2,3],[4,3],
  [1,2],[3,2],[5,2],[2,2],[4,2],
  [1,3],[5,3],
  [2,1],[4,1],[3,1],[1,1],[5,1],
  [0,3],[6,3],[0,2],[6,2],[0,1],[6,1],[0,0],[6,0]
];
const RANGED_FORM_SLOTS=[
  [3,0],[2,0],[4,0],[1,0],[5,0],
  [3,1],[2,1],[4,1],[1,1],[5,1],
  [1,2],[3,2],[5,2],[2,2],[4,2],
  [3,3],[2,3],[4,3],[1,3],[5,3],
  [0,0],[6,0],[0,1],[6,1],[0,2],[6,2],[0,3],[6,3]
];
function autoArrange(P){
  const all=[];P.board.forEach(u=>u&&all.push(u));P.bench.forEach(u=>u&&all.push(u));
  const cap=Math.min(P.lvl,all.length),chosen=[],pool=all.slice();
  while(chosen.length<cap){
    let bi=-1,bs=-1e9;
    pool.forEach((u,i)=>{
      const H=HERO[u.h];let sc2=H.cost*Math.pow(2.2,u.s-1)+u.s*1.5;
      for(const t of [H.o,H.c]){
        const set=new Set(chosen.map(x=>x.h).filter(h=>HERO[h].o===t||HERO[h].c===t));
        if(!set.has(u.h)){const n=set.size;if(tierOf(t,n+1)>tierOf(t,n))sc2+=3;else if(n>0)sc2+=.6;}
        if(P.fav&&P.fav.includes(t))sc2+=1;
      }
      if(sc2>bs){bs=sc2;bi=i;}
    });
    chosen.push(pool.splice(bi,1)[0]);
  }
  P.board.fill(null);P.bench.fill(null);
  const rest=pool;rest.forEach((u,i)=>{P.bench[i]=u;});
  const melee=chosen.filter(u=>MELEE.includes(HERO[u.h].c)).sort((a,b)=>MELEE.indexOf(HERO[a.h].c)-MELEE.indexOf(HERO[b.h].c));
  const rng=chosen.filter(u=>!MELEE.includes(HERO[u.h].c));
  const placeUnit=(u,slots)=>{
    for(const [r,c] of slots){
      const idx=r*4+c;
      if(!P.board[idx]){P.board[idx]=u;return true;}
    }
    return false;
  };
  melee.forEach(u=>placeUnit(u,MELEE_FORM_SLOTS));
  rng.forEach(u=>placeUnit(u,RANGED_FORM_SLOTS));
}

/* --- ván đấu --- */
const lossDamage=(r,s)=>Math.round((2+Math.floor(r*.6)+s*2)*(r>28?1.5:1));
const isPve=r=>PVE_ROUNDS.includes(r);
function incomeOf(p,r){
  const base=r<=2?2:r===3?3:r===4?4:5,s=Math.abs(p.streak);
  const sb=s<2?0:s<4?1:s<5?2:3;
  return {base,interest:Math.min(5,Math.floor(p.gold/10)),streak:sb,win:p.lastWin&&p.streak>0?1:0};
}
const BOT_NAMES=['Quan Lang','Mị Nương','Lạc Hầu','Lạc Tướng','Bồ Chính','Phụ Đạo','Hùng Vương'];
const AV8=['🐲','🐯','🐃','🦚','🐍','🦅','🐘','🦌'];
function newGame(cfg){
  cfg=cfg||{};
  const G={players:[],round:0,matches:[],diff:cfg.diff||1,auto:!!cfg.auto,over:false,winner:null,inc:null,pool:poolInit()};
  const myAv=cfg.av||'🐲',rest=AV8.filter(a=>a!==myAv);
  const me=newPlayer('Bạn',!cfg.auto,0,myAv);G.players.push(me);G.me=me;
  for(let i=0;i<7;i++){const b=newPlayer(BOT_NAMES[i],false,i+1,rest[i]);b.fav=[pickOf(['hongbang','aulac','khoinghia','lytran','lamson','tayson']),pickOf(['chienbinh','hove','cungno','thuatsi','dukich'])];G.players.push(b);}
  for(const p of G.players){
    const avail=BYCOST[1].filter(h=>poolCount(G,h)>0);
    const h=avail.length?pickOf(avail):pickOf(BYCOST[1]);
    if(addUnit(p,mkUnitObj(h,1)))poolTake(G,h);
  }
  return G;
}
function startRound(G){
  G.round++;const r=G.round;G.inc=null;
  for(const p of G.players){
    if(!p.alive)continue;
    if(r>1){
      const inc=incomeOf(p,r);let tot=inc.base+inc.interest+inc.streak+inc.win;
      if(!p.human)tot+=G.diff>1?1:G.diff<1?-1:0;
      p.gold+=Math.max(0,tot);p.xp+=2;levelCheck(p);
      if(p.human)G.inc={tot:Math.max(0,tot),inc};
    }
    if(p.human&&!G.auto)p.shop=rollShop(G,p);else botPrep(G,p);
  }
  G.matches=makeMatches(G);
}
function makeMatches(G){
  const A=G.players.filter(p=>p.alive);
  if(isPve(G.round))return A.map(p=>({a:p,b:null,pve:true}));
  shuffle(A);const ms=[];
  for(let i=0;i+1<A.length;i+=2)ms.push({a:A[i],b:A[i+1]});
  if(A.length%2){const last=A[A.length-1],others=A.filter(x=>x!==last);ms.push({a:last,b:pickOf(others),ghost:true});}
  for(const m of ms)if(!m.pve&&!m.ghost&&m.b.human){const t=m.a;m.a=m.b;m.b=t;}
  return ms;
}
function matchUnits(G,m){return [boardToUnits(m.a,0),m.pve?pveUnits(G.round):boardToUnits(m.b,1)];}
function simMatch(G,m){const [ua,ub]=matchUnits(G,m);const B=runBattle(newBattle(ua.concat(ub),false));return {win0:B.winner===0,surv:B.surv,draw:B.winner===null};}
function giveReward(G,p,r){
  const rw=PVE_RW[r];if(!rw)return null;
  const avail=BYCOST[rw.cost].filter(h=>poolCount(G,h)>0);
  if(avail.length){
    const h=pickOf(avail);
    if(canAdd(p,h)&&poolTake(G,h)){
      if(addUnit(p,mkUnitObj(h,1)))return {h,relic:!!rw.relic};
      poolReturn(G,h,1);
    }
  }
  p.gold+=rw.cost;
  return {gold:rw.cost,relic:!!rw.relic};
}
function addRelic(p,id){const r=RELICS.find(x=>x.id===id);p.relics.push(id);if(r.gold)p.gold+=r.gold;}
function applyRound(G){
  const info={};
  for(const m of G.matches){
    if(!m.res)m.res=simMatch(G,m);
    if(m.res.draw)continue;
    const {win0,surv}=m.res;
    if(m.pve){
      if(win0){if(m.a.human)info.reward=PVE_RW[G.round];else{const x=giveReward(G,m.a,G.round);if(x&&x.relic)addRelic(m.a,pickOf(RELICS).id);}}
      continue;
    }
    const dmg=lossDamage(G.round,surv);
    const win=p=>{p.streak=p.streak>0?p.streak+1:1;p.lastWin=true;};
    const lose=(p,d)=>{p.streak=p.streak<0?p.streak-1:-1;p.lastWin=false;p.hp-=d;};
    if(win0){win(m.a);if(!m.ghost)lose(m.b,dmg);}else{lose(m.a,dmg);if(!m.ghost)win(m.b);}
    if(m.a.human||(m.b&&m.b.human&&!m.ghost))info.dmg=dmg;
  }
  const n=G.players.filter(p=>p.alive).length;
  const dead=G.players.filter(p=>p.alive&&p.hp<=0).sort((a,b)=>b.hp-a.hp);
  dead.forEach((p,i)=>{p.alive=false;p.hp=Math.max(0,p.hp);p.place=n-dead.length+1+i;for(const u of [...p.board,...p.bench])if(u)poolReturn(G,u.h,copiesOf(u));p.board.fill(null);p.bench.fill(null);});
  const left=G.players.filter(p=>p.alive);
  if(left.length<=1){G.over=true;if(left[0]){left[0].place=1;G.winner=left[0];}}
  if(G.round>=70&&!G.over){G.over=true;const s=left.sort((a,b)=>b.hp-a.hp);s.forEach((p,i)=>p.place=i+1);G.winner=s[0];}
  return info;
}

/* --- máy chơi --- */
function ownedWeight(P,h){let n=0;for(const u of [...P.board,...P.bench])if(u&&u.h===h)n+=Math.pow(3,u.s-1);return n;}
function buyScore(P,h){
  const H=HERO[h];let sc2=H.cost*1.2;const own=ownedWeight(P,h);
  if(own>=1)sc2+=4+own;if(own>=2)sc2+=6;
  for(const t of [H.o,H.c])if(P.fav.includes(t))sc2+=2;
  const have=traitCounts(boardList(P));for(const t of [H.o,H.c])if(have[t])sc2+=1;
  if(H.cost>P.lvl-1&&own<1)sc2-=2;
  return sc2;
}
function bankKeep(r){return r<4?0:r<9?10:r<16?20:30;}
function targetLvl(r){return Math.min(9,2+Math.floor((r+1)/3.2));}
function benchSpace(G,P,h){
  if(canAdd(P,h))return true;
  let wi=-1,ws=1e9;
  P.bench.forEach((u,i)=>{if(!u||u.h===h)return;const v=HERO[u.h].cost*Math.pow(3,u.s-1);if(v<ws){ws=v;wi=i;}});
  if(wi>=0){sellUnit(G,P,'bench',wi);return true;}
  return false;
}
function botPrep(G,b){
  b.shop=rollShop(G,b);
  const k=G.diff,keep=bankKeep(G.round);let rerolls=0,guard=0;
  while(guard++<16){
    if(Math.random()>k)break;
    let did=false;
    const sc2=b.shop.map((h,i)=>h?{i,h,s:buyScore(b,h)}:null).filter(Boolean).sort((x,y)=>y.s-x.s);
    for(const s of sc2){
      const c=HERO[s.h].cost,pair=ownedWeight(b,s.h)>=1;
      if(b.gold>=c&&(b.gold-c>=keep||pair)&&s.s>0&&benchSpace(G,b,s.h)){if(buyUnit(G,b,s.i)){did=true;break;}}
    }
    if(did)continue;
    if(b.lvl<9&&b.lvl<targetLvl(G.round)&&b.gold>=4&&b.gold-4>=Math.max(0,keep-10)){buyXp(b);continue;}
    if(rerolls<4&&b.gold-2>=Math.max(keep,G.round>5?20:0)&&G.round>2){reroll(G,b);rerolls++;continue;}
    break;
  }
  autoArrange(b);
}
function playAuto(G,maxRounds){
  while(!G.over&&G.round<(maxRounds||80)){startRound(G);applyRound(G);}
  return G;
}
/*ENGINE_END*/
</script>

<script>
/*UI_START*/
(function(){
'use strict';
const $=s=>document.querySelector(s);
let G=null;

  for(let i=0;i<48;i++){const r=i%2?66:84,a=i*Math.PI/24;zig+=(i?'L':'M')+(Math.cos(a)*r).toFixed(1)+' '+(Math.sin(a)*r).toFixed(1);}
  s+='<path d="'+star+'Z"/><path d="'+zig+'Z"/></g>';

    $('#shop').classList.add('selling');$('#sellz').textContent='Thả vào đây để bán +'+sellValue(u)+' vàng';
  }
  if(d.moved){
    e.preventDefault();
    d.ghost.style.left=e.clientX+'px';d.ghost.style.top=e.clientY+'px';
    document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));
    const tg=document.elementFromPoint(e.clientX,e.clientY),dz=tg&&tg.closest('[data-drop]');

  }
},{passive:false});
function endDrag(e,cancel){
  const d=U.drag;if(!d)return;U.drag=null;
  document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));
  $('#shop').classList.remove('selling');
  if(d.ghost)d.ghost.remove();
  if(cancel)return;
  if(!d.moved){U.suppress=true;setTimeout(()=>U.suppress=false,80);selectUnit(d.k,d.i);return;}
  U.suppress=true;setTimeout(()=>U.suppress=false,60);
  const tg=document.elementFromPoint(e.clientX,e.clientY),dz=tg&&tg.closest('[data-drop]');
  if(!dz)return;
  const kind=dz.dataset.drop;
  if(kind==='sell'){const v=sellUnit(G,me(),d.k,d.i);if(v)toast('Đã bán, +'+v+' vàng');U.sel=null;U.peek=null;}
  else{moveUnit(me(),{k:d.k,i:d.i},{k:kind,i:+dz.dataset.i});U.sel=null;U.peek=null;}
  renderAll();
}

function syncBench(){const w=$('#tiltwrap'),bw=$('#boardwrap'),bL=$('#benchL'),ar=$('#arena');
  if(!w||!bL||!ar)return;
  if(!w.classList.contains('tilt')||innerWidth<980){bL.style.height='';bL.style.width='';bL.style.setProperty('--bs','');bL.style.display='';bL.style.position='';w.style.height='';if(bw)bw.style.height='';[...bL.children].forEach(s=>{s.style.transform='';s.style.position='';s.style.top='';s.style.left='';s.style.width='';s.style.height='';s.style.margin='';});return;}
  const H=ar.offsetHeight,V=Math.round(H*0.883*1050/(1050+H*0.469)),benchV=Math.max(V,360),s=Math.max(28,Math.min(34,Math.floor((benchV-30)/9)));
  w.style.height=V+'px';if(bw)bw.style.height=V+'px';
  bL.style.display='block';bL.style.position='relative';
  bL.style.height=benchV+'px';bL.style.width=s+'px';bL.style.setProperty('--bs',s+'px');
  const c=U.c||100;
  const maxShift=4*c*(0.469*H/(1050+0.469*H));
  const baseOffset=4;
  const stepY=(benchV-s)/8;
  [...bL.children].forEach((el,i)=>{
    const prog=(8-i)/8*maxShift;
    const posX=(prog+baseOffset).toFixed(1);
    const posY=(i*stepY).toFixed(1);
    el.style.position='absolute';

function recordBattleStats(B){
  const mapU=u=>{
    const H=u.h?HERO[u.h]:null;
    return {
      id:u.id,side:u.side,h:u.h||'',
      name:u.name||(H?H.name:'Tướng'),
      star:u.s||u.star||1,
      mon:!!u.mon,boss:!!u.boss,ico:u.ico||(H?H.ico:'⚔️'),
      org:u.org||(H?H.o:''),cls:u.cls||(H?H.c:''),
      dmg:Math.round(u.dmgDealt||0),
      taken:Math.round(u.dmgTaken||0)
    };
  };
  const lm=U.lm;
  let foeName='Phe địch',foeAv='⚔️';
  if(lm){
    if(lm.pve){foeName='Quái vật';foeAv='👹';}
    else if(lm.ghost){foeName='Bóng '+(lm.b?lm.b.name:'Đối thủ');foeAv=(lm.b&&lm.b.av)||'👻';}
    else if(lm.b){foeName=lm.b.name;foeAv=lm.b.av||'🤖';}
  }
  G.lastBattleStats={
    allies:B.units.filter(u=>u.side===0).map(mapU),
    enemies:B.units.filter(u=>u.side===1).map(mapU),
    winner:B.winner,
    round:G.round,
    allyName:(me()&&me().name)||'Bạn',
    allyAv:(me()&&me().av)||'🐲',
    foeName,foeAv
  };
}

function renderQC(){
  const data=G&&G.lastBattleStats;
  const m=$('#qcModal');if(!m)return;
  const elAlly=$('#qcListAlly'),elFoe=$('#qcListFoe');
  if(!elAlly||!elFoe)return;
  const key=qcMode==='dmg'?'dmg':'taken';

  const qtd=$('#qcTabDmg'),qtt=$('#qcTabTkn');
  if(qtd)qtd.classList.toggle('on',qcMode==='dmg');
  if(qtt)qtt.classList.toggle('on',qcMode==='tkn');

  const res=U.lastBattleResult||{};
  const badge=$('#qcResBadge'),sub=$('#qcResSub'),line=$('#qcResLine');
  if(badge){
    badge.className='qc-res-badge '+(res.draw?'draw':(res.won?'win':'lose'));
    badge.textContent=res.draw?'HÒA':(res.won?'CHIẾN THẮNG':'THẤT BẠI');
  }
  if(sub)sub.textContent='Vòng '+(data?data.round:(G?G.round:1));
  if(line)line.textContent=res.line||'';

  const nmAlly=$('#qcNameAlly'),nmFoe=$('#qcNameFoe');
  if(nmAlly)nmAlly.textContent=(data&&data.allyName)||'Bạn';
  if(nmFoe)nmFoe.textContent=(data&&data.foeName)||'Phe địch';

  if(!data||(!data.allies.length&&!data.enemies.length)){
    elAlly.innerHTML='<div class="qc-empty">Chưa có dữ liệu chiến trận.</div>';
    elFoe.innerHTML='<div class="qc-empty">Chưa có dữ liệu chiến trận.</div>';
    return;
  }

  const allies=[...data.allies].sort((a,b)=>(b[key]||0)-(a[key]||0));
  const enemies=[...data.enemies].sort((a,b)=>(b[key]||0)-(a[key]||0));
  const maxVal=Math.max(1,...allies.map(u=>u[key]||0),...enemies.map(u=>u[key]||0));
  const totAlly=allies.reduce((s,u)=>s+(u[key]||0),0);
  const totFoe=enemies.reduce((s,u)=>s+(u[key]||0),0);

  const tElAlly=$('#qcTotAlly'),tElFoe=$('#qcTotFoe');
  if(tElAlly)tElAlly.textContent='Tổng: '+totAlly.toLocaleString();
  if(tElFoe)tElFoe.textContent='Tổng: '+totFoe.toLocaleString();

  const renderSide=(list,total)=>{
    if(!list.length)return '<div class="qc-empty">Không có tướng tham chiến</div>';
    return list.map((u,i)=>{
      const val=u[key]||0;
      const pct=maxVal>0?Math.min(100,Math.round((val/maxVal)*100)):0;
      const share=total>0?Math.round((val/total)*100):0;
      const stars='\u2605'.repeat(u.star||1);
      const isMvp=(i===0&&val>0);
      const barClass=qcMode==='dmg'?'bar-dmg':'bar-tkn';

      let imgHtml='';
      if(u.h){
        imgHtml=portrait(u.h);
      }else if(u.name&&MON_IMG[u.name]){
        imgHtml='<img class="pimg" draggable="false" src="'+MON_IMG[u.name]+'" alt="">';
      }else{
        imgHtml='<span class="qc-ico-txt">'+(u.ico||'👹')+'</span>';
      }

      let traitsHtml='';
      if(u.h&&HERO[u.h]){
        const H=HERO[u.h];
        const oIco=TR[H.o]?TR[H.o].ico:'';
        const cIco=TR[H.c]?TR[H.c].ico:(CS[H.c]?CS[H.c].ico:'');
        const oNm=TR[H.o]?TR[H.o].name:'';
        const cNm=TR[H.c]?TR[H.c].name:(CS[H.c]?CS[H.c].name:'');
        traitsHtml='<span class="qc-trait" title="'+oNm+'">'+oIco+'</span><span class="qc-trait" title="'+cNm+'">'+cIco+'</span>';
      }else if(u.mon){
        traitsHtml='<span class="qc-trait" title="Quái vật">👹</span><span class="qc-trait" title="'+(u.boss?'Thủ lĩnh':'Dã quái')+'">'+(u.boss?'👑':'🌲')+'</span>';
      }

      const mvpBadge=isMvp?'<span class="qc-mvp">MVP</span>':'';

      return '<div class="qc-row '+(isMvp?'is-mvp':'')+'">'
        +'<div class="qc-tok" data-s="'+(u.star||1)+'">'+imgHtml+'</div>'
        +'<div class="qc-hero-meta">'
          +'<div class="qc-hero-top">'
            +'<span class="qc-hero-nm" title="'+u.name+'">'+u.name+'</span>'
            +'<span class="qc-stars s'+(u.star||1)+'">'+stars+'</span>'
            +'<div class="qc-traits">'+traitsHtml+'</div>'
            +mvpBadge
          +'</div>'
          +'<div class="qc-bar-bg"><div class="qc-bar-fill '+barClass+'" style="width:'+pct+'%"></div></div>'
        +'</div>'
        +'<div class="qc-val">'
          +'<b>'+val.toLocaleString()+'</b>'
          +'<small>'+share+'%</small>'
        +'</div>'
      +'</div>';
    }).join('');
  };

  elAlly.innerHTML=renderSide(allies,totAlly);
  elFoe.innerHTML=renderSide(enemies,totFoe);
}

function readyGo(force){

function fillBoard(P){
  const list=P.bench.map((u,i)=>u?{u,i}:null).filter(Boolean).sort((a,b)=>HERO[b.u.h].cost*b.u.s-HERO[a.u.h].cost*a.u.s);
  for(const b of list){
    if(boardCount(P)>=P.lvl)break;
    const slots=MELEE.includes(HERO[b.u.h].c)?MELEE_FORM_SLOTS:RANGED_FORM_SLOTS;
    for(const [r,c] of slots){
      const idx=r*4+c;
      if(!P.board[idx]){
        P.board[idx]=b.u;
        P.bench[b.i]=null;
        break;
      }
    }
  }
}

  const opts=shuffle(RELICS.filter(r=>!me().relics.includes(r.id))).slice(0,3);
  const ov=$('#ov');
  ov.innerHTML='<div class="dlg"><h2>Chọn một bảo vật</h2><p>Bảo vật có hiệu lực suốt ván đấu.</p><div class="relics">'+opts.map(r=>'<button class="relic" data-r="'+r.id+'"><span class="ri">'+r.ico+'</span><div><b>'+r.name+'</b><span>'+r.desc+'</span></div></button>').join('')+'</div></div>';
  ov.className='ov show';
  ov.onclick=e=>{const b=e.target.closest('[data-r]');if(!b)return;addRelic(me(),b.dataset.r);ov.className='ov';ov.onclick=null;toast('Nhận bảo vật: '+RELICS.find(r=>r.id===b.dataset.r).name);done();};
}
function showEnd(){
  const P=me(),won=G.winner===P;
  const ov=$('#ov');
  const rank=G.players.slice().sort((a,b)=>(a.place||99)-(b.place||99)).map(p=>'<div style="display:flex;gap:8px;padding:2px 0"><b style="width:26px">#'+(p.place||'?')+'</b><span>'+p.av+' '+p.name+'</span></div>').join('');
  ov.innerHTML='<div class="dlg"><h1 style="font-size:34px">'+(won?'Thiên hạ thái bình':'Bạn đã bại trận')+'</h1><p>'+(won?'Bạn là người đứng cuối cùng sau '+G.round+' vòng.':'Bạn về hạng '+P.place+' trên 8 người, ở vòng '+G.round+'.')+'</p><div style="margin:8px 0;color:var(--ink)">'+rank+'</div><div style="display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap"><button class="btn" id="qcViewFinal">📊 Xem thống kê ván cuối</button><button class="go big-go" id="again">Chơi lại</button></div></div>';
  ov.className='ov show';ov.onclick=null;
  $('#again').onclick=()=>{ov.className='ov';showStart();};
  const _qcf=$('#qcViewFinal');if(_qcf)_qcf.onclick=()=>openQCModal();
}
/* ---------- màn hình đầu và hướng dẫn ---------- */
const HOW='<ol class="how"><li>Mỗi vòng có thời gian chuẩn bị: mua tướng ở cửa hàng, kéo hoặc chạm để đặt lên bàn. Số tướng trên bàn bằng cấp của bạn.</li><li>Hết giờ, tướng tự giao tranh. Thua thì mất máu; hết máu là bị loại. Người cuối cùng còn lại thắng.</li><li>3 tướng giống nhau gộp thành 1 tướng ★★ mạnh hơn và to hơn. 3 tướng ★★ gộp thành ★★★. Kỹ năng cũng mạnh theo sao.</li><li>Tướng cùng Tộc hoặc cùng Hệ kích hoạt cộng hưởng. Chạm vào ô Tộc/Hệ để xem chi tiết. Chạm vào tướng, rồi chọn Xem ★ để so kỹ năng từng sao.</li><li>Vòng 1, 2, 3, 8, 15, 22 đánh quái vật. Thắng để nhận tướng; vòng đầu lĩnh còn có bảo vật. Boss miễn nhiễm choáng, đè, kéo và kết liễu.</li><li>Giữ 10 vàng để có lãi, tối đa +5 mỗi vòng. Thắng hoặc thua liên tiếp cũng được thưởng vàng.</li><li>Nút Hiệu ứng đổi giữa Đủ, Gọn, Tối giản. Chế độ nhẹ hơn chỉ bớt hình ảnh, kết quả trận không đổi.</li><li>Phím tắt trên máy tính: D làm mới, F mua kinh nghiệm, Enter vào trận.</li></ol>';
function showHelp(){
  const ov=$('#ov');
  ov.innerHTML='<div class="dlg"><h2>Cách chơi</h2>'+HOW+'<button class="go big-go" id="closehelp">Đã hiểu</button></div>';
  ov.className='ov show';$('#closehelp').onclick=()=>ov.className='ov';ov.onclick=null;
}
function showStart(){
  let selAv=store.get('chs_av')||'🐲';
  const ov=$('#ov');
  ov.innerHTML='<div class="dlg"><svg class="drumbg" viewBox="-100 -100 200 200">'+$('#drum').innerHTML.replace(/#d6a335/g,'#b3281d')+'</svg><h1>Cờ Huyền Sử</h1><p style="margin-top:6px">Cờ nhân phẩm với thần tướng nước Việt. Bạn đấu với 7 đối thủ máy, người cuối cùng còn trụ là người thắng.</p><p class="note">Game lấy cảm hứng từ huyền sử và lịch sử Việt Nam. Sức mạnh của các tướng trong game chỉ để chơi cho vui, không phải xếp hạng thật, và không có ý so sánh, hạ thấp hay giễu cợt các vị tiền nhân.</p>'
   +'<div class="row"><label>Độ khó máy</label><div class="seg" id="sd"><button data-v="0.6">Dễ</button><button data-v="1" class="on">Thường</button><button data-v="1.5">Khó</button></div></div>'
   +'<div class="row"><label>Đồng hồ chuẩn bị</label><div class="seg" id="st"><button data-v="40" class="on">40 giây</button><button data-v="0">Không giới hạn</button></div></div>'
   +'<div class="row"><label>Biểu tượng</label><div class="avp" id="sav">'+AV8.map(a=>'<button data-a="'+a+'" class="'+(a===selAv?'on':'')+'">'+a+'</button>').join('')+'</div></div>'
   +'<button class="go big-go" id="play">Vào trận</button>'
   +'<p style="text-align:center;margin:10px 0 0"><a href="https://kybien.blogspot.com/p/tieu-diem-tuong.html" target="_blank" rel="noopener">\u2605 Ti\u00eau \u0111i\u1ec3m t\u01b0\u1edbng \u2014 xem chi\u00eau t\u1eebng t\u01b0\u1edbng</a></p>'+HOW+'</div>';
  ov.className='ov show';ov.onclick=null;
  const seg=(id)=>{$(id).onclick=e=>{const b=e.target.closest('button');if(!b)return;[...$(id).children].forEach(x=>x.classList.remove('on'));b.classList.add('on');};};
  seg('#sd');seg('#st');
  $('#sav').onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;selAv=b.dataset.a;store.set('chs_av',selAv);[...$('#sav').children].forEach(x=>x.classList.toggle('on',x===b));};
  $('#play').onclick=()=>{
    const dv=+$('#sd .on').dataset.v,tv=+$('#st .on').dataset.v;
    U.diff=dv;U.noTimer=!tv;U.prepTime=tv||40;
    const dk=dv>=1.5?2:dv>=1?1:0.6;
    G=newGame({diff:dk,av:selAv});G.diff=dk;
    ov.className='ov';beginRound();
  };
}
setInterval(()=>{
  if(!G||U.phase!=='prep')return;
  const now=performance.now(),dt=Math.min(.5,(now-(U.tick||now))/1000);U.tick=now;
  if(U.noTimer){$('#ttxt').textContent='Không giới hạn';$('#tfill').style.width='100%';const _ct=$('#clockTxt'),_cf=$('#clockFill');if(_ct)_ct.textContent='\u221e';if(_cf)_cf.style.height='100%';return;}
  if($('#ov').classList.contains('show'))return;
  U.timer-=dt;
  $('#ttxt').textContent=Math.max(0,Math.ceil(U.timer))+' giây';
  $('#tfill').style.width=Math.max(0,U.timer/(U.prepTime+(G.round===1?20:0))*100)+'%';const _ct=$('#clockTxt'),_cf=$('#clockFill');if(_ct)_ct.textContent=Math.max(0,Math.ceil(U.timer));if(_cf)_cf.style.height=Math.max(0,U.timer/(U.prepTime+(G.round===1?20:0))*100)+'%';
  if(U.timer<=0){readyGo(true);}
},200);
addEventListener('resize',fit);
buildStatic();fit();setFxLabel();applyView();
U.phase='menu';
G=newGame({});G.matches=[];
renderAll();
const dm=new URLSearchParams(location.search).get('demo');
if(dm&&HERO[dm])startDemo(dm);else showStart();
/*UI_END*/
})();
</script>
</body>
