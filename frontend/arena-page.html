vic:v?{t:v.hd?stdT(v.r,v.c):v.t,col:v.col,p:{},st:0,hd:v.hd,r:tr,c:tc}:null,gm:died?{t:o.t,col:o.col,p:{},st:0,hd:false,r:tr,c:tc}:null,

function geom(now,k){const p=Math.min(1,Math.max(0,(now-ANIM.t0)/ANIM.dm-(k||0))),e=ease(p),s=Math.sin(Math.PI*p);
return{p:p,s:s,ox:(ANIM.fx-ANIM.tx)*(1-e),oy:(ANIM.fy-ANIM.ty)*(1-e)-ANIM.h*s,sc:1+.14*s}}
function drawAt(piece,g,al){x.save();x.globalAlpha=al;x.translate(ANIM.tx+g.ox,ANIM.ty+g.oy);x.scale(g.sc,g.sc);x.translate(-ANIM.tx,-ANIM.ty);pcBase(piece);x.restore()}

bd.forEach((e,i)=>{const a=-.75+i*.9,bx=X+(PR+1)*Math.cos(a),by=Y+(PR+1)*Math.sin(a);x.beginPath();x.arc(bx,by,9,0,7);x.fillStyle='rgba(20,12,6,.9)';x.fill();
x.lineWidth=1.2;x.strokeStyle='#e5b36a';x.stroke();x.font='12px sans-serif';x.fillStyle='#fff';x.fillText(e,bx,by+1)})}

function pc(o){
if(ANIM&&ANIM.o===o){const now=performance.now();
if(ANIM.vic){const q=Math.max(0,(now-ANIM.t0-ANIM.dm)/(ANIM.total-ANIM.dm));x.save();x.translate(ANIM.tx,ANIM.ty);x.rotate(q*.5);x.scale(1+.4*q,1+.4*q);x.translate(-ANIM.tx,-ANIM.ty);x.globalAlpha=1-q;pcBase(ANIM.vic);x.restore()}
const g=geom(now);
if(g.s>.02){x.save();x.fillStyle='rgba(0,0,0,'+(.28*g.s)+')';x.beginPath();x.ellipse(ANIM.tx+g.ox,ANIM.ty+g.oy+ANIM.h*g.s+8,Math.max(0.1,PR*.9),Math.max(0.1,PR*.45),0,0,7);x.fill();x.restore()}
if(g.p<1)for(let i=3;i>=1;i--)drawAt(o,geom(now,.07*i),.26-.06*i);
drawAt(o,g,1)}else pcBase(o)}
function marks(){x.save();x.strokeStyle='rgba(255,214,102,.9)';x.lineWidth=2.5;x.setLineDash([4,5]);x.globalAlpha=.55;x.beginPath();x.arc(LASTMV.fx,LASTMV.fy,Math.max(0.1,PR+4),0,7);x.stroke();x.setLineDash([]);
x.globalAlpha=.9;const s=29,l=9,X=LASTMV.tx,Y=LASTMV.ty;x.beginPath();
for(const q of[[-1,-1],[1,-1],[1,1],[-1,1]]){x.moveTo(X+q[0]*s,Y+q[1]*(s-l));x.lineTo(X+q[0]*s,Y+q[1]*s);x.lineTo(X+q[0]*(s-l),Y+q[1]*s)}x.stroke();x.restore()}

function draw(){

for(const col of['r','b'])for(const o of P[col])if(!o.dead)pc(o);
for(const col of['r','b']){const b=KB[col];if(b&&b.n>0){const k=K[col],a=Math.atan2(b.d[0]*(flipped?-1:1),b.d[1]*(flipped?-1:1));x.beginPath();x.arc(PX(k.c),PY(k.r),Math.max(0.1,PR+9),a-.7,a+.7);x.strokeStyle='#3498db';x.lineWidth=5;x.stroke()}}

const now=performance.now();let more=false;
if(ANIM){if(!ANIM.imp&&now>=ANIM.t0+ANIM.dm){ANIM.imp=1;impact()}if(now>=ANIM.t0+ANIM.total)ANIM=null;else more=true}
if(LASTMV)marks();

x.save();x.strokeStyle='#8bc34a';x.fillStyle='#8bc34a';x.lineWidth=6;x.globalAlpha=.85;x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0]-Math.cos(ang)*14,b[1]-Math.sin(ang)*14);x.stroke();
x.beginPath();x.moveTo(b[0],b[1]);x.lineTo(b[0]-Math.cos(ang-.45)*24,b[1]-Math.sin(ang-.45)*24);x.lineTo(b[0]-Math.cos(ang+.45)*24,b[1]-Math.sin(ang+.45)*24);x.fill();x.restore();more=true}}
if(!over&&!ANIM&&inCheck(turn)){const k=K[turn],X=PX(k.c),Y=PY(k.r),a=.5+.5*Math.sin(now/130);x.save();
x.strokeStyle='rgba(255,60,60,'+(.55+.4*a)+')';x.lineWidth=3+2*a;x.shadowColor='#ff2a2a';x.shadowBlur=14;x.beginPath();x.arc(X,Y,Math.max(0.1,PR+7+3*a),0,7);x.stroke();
x.shadowBlur=0;x.font='bold 13px "Be Vietnam Pro",sans-serif';x.textAlign='center';x.fillStyle='#ff6b6b';x.strokeStyle='rgba(0,0,0,.8)';x.lineWidth=3;
x.strokeText('CHIẾU!',X,Y-PR-14);x.fillText('CHIẾU!',X,Y-PR-14);x.restore();more=true}
if(armed&&!armed.o.dead){const X=PX(armed.o.c),Y=PY(armed.o.r);x.save();x.strokeStyle='#ffa726';x.lineWidth=3;x.shadowColor='#ff9800';x.shadowBlur=12;
x.setLineDash([8,6]);x.lineDashOffset=-now/40;x.beginPath();x.arc(X,Y,Math.max(0.1,PR+8+2*Math.sin(now/160)),0,7);x.stroke();x.restore();more=true}
for(const col of['r','b'])for(const o of P[col]){if(o.dead||o.st<=0)continue;const X=PX(o.c),Y=PY(o.r);x.save();
x.strokeStyle='#5dade2';x.lineWidth=2;x.setLineDash([5,5]);x.lineDashOffset=-now/50;x.beginPath();x.arc(X,Y,Math.max(0.1,PR+4),0,7);x.stroke();x.setLineDash([]);
x.font='14px sans-serif';x.textAlign='center';x.textBaseline='middle';
for(let i=0;i<3;i++){const a=now/260+i*2.09;x.fillText('⭐',X+17*Math.cos(a),Y-PR-3+5*Math.sin(a))}x.restore();more=true}
if(bag){const X=PX(bag.c),Y=PY(bag.r),s=Math.sin(now/220);x.save();x.beginPath();x.arc(X,Y,22,0,7);x.fillStyle='rgba(255,215,0,.3)';x.fill();
x.strokeStyle='rgba(255,213,79,'+(.55+.3*s)+')';x.lineWidth=2.5;x.beginPath();x.arc(X,Y,Math.max(0.1,25+3*s),0,7);x.stroke();

x.font='12px sans-serif';for(let i=0;i<4;i++){const a=now/500+i*1.571;x.fillText('✨',X+31*Math.cos(a),Y+31*Math.sin(a))}x.restore();more=true}

const dt=Math.min(50,now-(lastFx||now));lastFx=FX.length?now:0;x.save();

const q=(now-f.t0)/f.dur;if(q>=1)return false;
if(f.k===1){x.globalAlpha=1-q;x.strokeStyle=f.col;x.lineWidth=f.w*(1-q)+.6;x.beginPath();x.arc(f.x,f.y,Math.max(0.1,f.max*easeOut(q)),0,7);x.stroke()}
else{const yy=f.y-28*easeOut(q);x.globalAlpha=1-q*q;x.font='bold 17px "Be Vietnam Pro",sans-serif';x.textAlign='center';x.textBaseline='middle';x.lineWidth=3;x.strokeStyle='rgba(0,0,0,.75)';x.strokeText(f.s,f.x,yy);x.fillStyle=f.col;x.fillText(f.s,f.x,yy)}
return true});x.restore();
if(more||FX.length)kick()}

/* ---------- ĐIỀU KHIỂN SỰ KIỆN ---------- */
function selCard(i){
const v=ai?'r':online.on?online.side:turn;if(over||busy||ANIM||used||ms||mode||!isMine(turn)||turn!==v)return;
const c=handOf(v)[i];if(!c)return;
if(pend===i){pend=null;say('Đã hủy chọn bí pháp','#a8947d');ui();return}
if(!isFree(v)&&merit[v]<c.cost){say('Không đủ Công trạng (cần '+c.cost+')!','#e74c3c');return}
pend=i;sel=null;VM=[];say(sideTag(turn)+' Chọn 1 quân '+TN[c.t]+' của mình để kích hoạt ['+c.name+']','#f1c40f','log-sp');ui();draw()}
function onClick(r,c){
if(over||busy||ANIM||!isMine(turn))return;
if(pend!==null){const cd=handOf(turn)[pend],o=B[r][c];
if(!o||o.col!==turn){say('Hãy chọn quân thuộc phe mình!','#e74c3c');return}
if(o.t!==cd.t){say('Bí pháp này chỉ dành cho '+TN[cd.t]+'!','#e74c3c');return}
const w=precheck(o,cd);if(w){say(w,'#e74c3c');return}commit(cd.id,o);return}
const hit=VM.some(q=>q[0]===r&&q[1]===c);
if(mode){if(hit){if(mode==='dir')setDir(Math.sign(r-sel.r),Math.sign(c-sel.c));else doSwap(r,c)}return}
if(ms){if(hit)stepFollow(r,c);return}
const p=B[r][c];
if(sel){if(p===sel){sel=null;VM=[];draw();return}if(hit){doMove(sel,r,c);return}
if(p&&p.col===turn){if(armed&&armed.o!==p)refundArmed();selectPiece(p)}}
else if(p&&p.col===turn)selectPiece(p)}
function selectPiece(o){sel=o;VM=o.st>0?[]:legalMoves(o,armed&&armed.o===o?armed.card.id:null);if(o.st>0)say('Quân đang trúng Định Thân Thuật','#3498db');ui();draw()}
cv.addEventListener('click',e=>{const b=cv.getBoundingClientRect(),X=(e.clientX-b.left)*600/b.width,Y=(e.clientY-b.top)*660/b.height;
let c=Math.round((X-OX)/CS),r=Math.round((Y-OY)/CS);if(flipped){r=9-r;c=8-c}
if(r>=0&&r<10&&c>=0&&c<9)onClick(r,c)});

/* ---------- TÀI KHOẢN & ONLINE SOCKET ---------- */
async function checkAuthUI(){
const token=localStorage.getItem('kybien_jwt_token'),un=$('auth-unlogged'),lg=$('auth-logged');
if(token){try{const res=await fetch(SERVER_API_ENDPOINT+'/api/auth/me',{headers:{Authorization:'Bearer '+token}});
if(res.ok){currentUser=await res.json();$('logged-username').innerText=currentUser.username;$('logged-level').innerText=currentUser.level;$('logged-elo').innerText=currentUser.elo;un.style.display='none';lg.style.display='flex';return true}}catch(e){}
localStorage.removeItem('kybien_jwt_token')}
currentUser=null;un.style.display='flex';lg.style.display='none';return false}
async function ensureUser(){
try{if(await checkAuthUI()&&currentUser)return true;
const g='KyThu_'+Math.floor(10000+Math.random()*90000),pw=Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2);
const res=await fetch(SERVER_API_ENDPOINT+'/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:g,email:g+'@kybien.com',password:pw})});
if(res.ok){const d=await res.json();if(d.token){localStorage.setItem('kybien_jwt_token',d.token);await checkAuthUI();return true}}}catch(e){}
return false}
async function authCall(path,body){
try{const res=await fetch(SERVER_API_ENDPOINT+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await res.json();
if(res.ok){localStorage.setItem('kybien_jwt_token',d.token);checkAuthUI()}else $('auth-err-msg').innerText=d.error||'Lỗi'}catch(e){alert('Không thể kết nối máy chủ!')}}
function arenaLogin(){const u=$('arena-u').value,p=$('arena-p').value;if(!u||!p)return alert('Vui lòng nhập tên tài khoản và mật khẩu!');authCall('/api/auth/login',{usernameOrEmail:u,password:p})}
function arenaRegister(){const u=$('arena-u').value,p=$('arena-p').value;if(!u||!p)return alert('Vui lòng nhập tên tài khoản và mật khẩu!');authCall('/api/auth/register',{username:u,email:u+'@kybien.com',password:p})}
function arenaLogout(){localStorage.removeItem('kybien_jwt_token');checkAuthUI()}
function showMatchModal(d,vt,side){
Snd.check();$('modal-match-variant').innerText='Thể loại: '+vt;
$('modal-match-players').innerHTML='Đỏ: <b>'+d.playerWhite.username+'</b> ('+d.playerWhite.elo+' ELO)<br/>Đen: <b>'+d.playerBlack.username+'</b> ('+d.playerBlack.elo+' ELO)';
$('modal-match-side').innerText='Bạn cầm quân: '+(side==='r'?'ĐỎ (đi trước)':'ĐEN (đi sau)');
$('match-found-modal').style.display='flex';let n=5;$('modal-countdown').innerText=n;
if(modalTimer)clearInterval(modalTimer);modalTimer=setInterval(()=>{n--;$('modal-countdown').innerText=n;if(n<=0)closeMatchModal()},1000)}
function closeMatchModal(){if(modalTimer)clearInterval(modalTimer);$('match-found-modal').style.display='none'}
function replay(acts,fallback){
REPLAY=true;ms=null;
try{for(const a of acts){
if(a.k==='c'){const o=B[a.r][a.c];if(o)commit(a.id,o)}
else if(a.k==='m'){const o=B[a.fr][a.fc];if(o)doMove(o,a.tr,a.tc,true)}
else if(a.k==='f'){if(ms)stepFollow(a.tr,a.tc,true)}
else if(a.k==='x'){if(ms)skipAction()}
else if(a.k==='d')setDir(a.dr,a.dc);
else if(a.k==='s')doSwap(a.r,a.c)}
if(!acts.length&&fallback){const o=B[fallback[0]][fallback[1]];if(o)doMove(o,fallback[2],fallback[3],false)}}
finally{REPLAY=false}
if(!over&&turn!==online.side&&!acts.length)endTurn()}
async function initSocket(){
await ensureUser();const token=localStorage.getItem('kybien_jwt_token');
if(!token||typeof io==='undefined'){alert('Không thể khởi tạo kết nối máy chủ!');return false}
if(!socket){socket=io(SERVER_API_ENDPOINT,{auth:{token}});
socket.on('connect',()=>socket.emit('get_public_rooms'));
socket.on('matchmaking_queued',d=>{$('st').innerText=d.message});
socket.on('room_created',d=>{const vn=VARS[d.variant]||'Cờ Tướng';$('st').innerText='Mã phòng: '+d.roomCode+' ['+vn+'] - đang chờ đối thủ...';say('[Hệ thống] Đã tạo mã phòng: '+d.roomCode+' ['+vn+'].','#f1c40f','log-sp');alert('Đã tạo phòng!\nMã phòng: '+d.roomCode+'\nThể loại: '+vn+(d.isPrivate?'\n(Phòng riêng)':'\n(Công khai)'))});
socket.on('public_rooms_list',rooms=>{const l=$('public-rooms-list');l.innerHTML='';
if(!rooms||!rooms.length){l.innerHTML='<div style="font-size:.72rem;color:var(--mu);text-align:center;padding:6px">Chưa có phòng công khai nào...</div>';return}
rooms.forEach(r=>{const d=document.createElement('div');d.style.cssText='display:flex;justify-content:space-between;align-items:center;background:#1a110a;border:1px solid var(--bd);padding:6px 8px;border-radius:6px;cursor:pointer';
d.innerHTML='<div><b style="color:var(--ac);font-size:.78rem">'+r.roomCode+'</b> <span style="font-size:.68rem;color:#2ecc71">['+(VARS[r.variant]||'Cờ Tướng')+']</span> <span style="font-size:.68rem;color:var(--mu)">'+r.hostName+'</span></div><span style="font-size:.68rem;color:#2ecc71">Vào đấu</span>';
d.addEventListener('click',()=>joinRoomByCode(r.roomCode));l.appendChild(d)})});
socket.on('match_found',d=>{
online.on=true;online.room=d.roomId;searching=false;
const isRed=(socket&&socket.id===d.playerWhite.socketId)||(currentUser&&currentUser.username===d.playerWhite.username);online.side=isRed?'r':'b';
if(d.variant)$('mode_variant').value=d.variant;
names={r:d.playerWhite.username+' ('+d.playerWhite.elo+')',b:d.playerBlack.username+' ('+d.playerBlack.elo+')'};
$('btn-action').innerText='Trận Đấu Đang Diễn Ra';
newGame(d.variant||VAR,d.initialPieces,String(d.roomId));flipped=online.side==='b';setLocked(true);ui();draw();
say('[Online] Kết nối trận thành công ['+VARS[VAR]+']! Bạn cầm quân '+(online.side==='r'?'ĐỎ':'ĐEN')+'.','#2ec4b6','log-sp');showMatchModal(d,VARS[VAR],online.side)});
socket.on('move_made',d=>{if(!online.on||over)return;const mineNow=d.turn===(online.side==='r'?'RED':'BLACK');if(!mineNow)return;
const m=d.move||{};let fb=null;if(m.from&&m.to){const f=m.from.split(',').map(Number),t=m.to.split(',').map(Number);fb=[f[0],f[1],t[0],t[1]]}
replay(m.acts||[],fb)});
socket.on('game_error',d=>alert(d.message))}
else if(!socket.connected)socket.connect();
socket.emit('get_public_rooms');return true}
async function createRoom(){if(!await initSocket())return;socket.emit('create_room',{isPrivate:$('chk-private-room').checked,variant:$('mode_variant').value})}
async function joinRoomByCode(code){const c=(typeof code==='string'&&code)||$('room-code-input').value;if(!c)return alert('Vui lòng nhập mã phòng (vd: KB-8899)');if(!await initSocket())return;socket.emit('join_room_by_code',{roomCode:c})}
function refreshPublicRooms(){if(socket)socket.emit('get_public_rooms')}
async function handleGameAction(){
if($('mode').value==='2p_online'){if(!await initSocket())return;
if(!searching){searching=true;$('btn-action').innerText='HỦY TÌM TRẬN';socket.emit('join_matchmaking',{variant:$('mode_variant').value})}
else{searching=false;$('btn-action').innerText='GHÉP TRẬN TỰ ĐỘNG';socket.emit('cancel_matchmaking');setLocked(false)}}
else{online.on=false;newGame()}}
